<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backdrop 16 / KOOL BERK WebGL Background</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #02050b;
        color: #f5f7fb;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      .stage {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 24% 60%, rgba(126, 182, 255, 0.26), transparent 46%),
          radial-gradient(ellipse at 86% 34%, rgba(56, 124, 235, 0.22), transparent 42%),
          radial-gradient(ellipse at 52% 44%, rgba(178, 214, 255, 0.08), transparent 40%),
          linear-gradient(145deg, #02050b, #061326 54%, #010205);
      }

      .backdrop-host {
        position: absolute;
        inset: 0;
      }

      .copy {
        position: relative;
        z-index: 2;
        display: grid;
        min-height: 100vh;
        align-items: end;
        padding: 40px;
        text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55);
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(54px, 8vw, 124px);
        line-height: 0.92;
        font-weight: 600;
      }

      p {
        max-width: 600px;
        margin: 22px 0 0;
        font-size: 18px;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.72);
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="backdrop-host" id="backdrop16"></div>
      <div class="copy">
        <div>
          <h1>KOOL BERK WebGL Background</h1>
          <p>
            Standalone raw WebGL backdrop extract for integration on another site.
          </p>
        </div>
      </div>
    </main>

    <script src="./kool-berk-background.js"></script>
    <script>
      window.KoolBerkWebGLBackground.mount("#backdrop16", {
        preset: "identity",
        maxDpr: 1.75,
        pointer: true,
        reducedMotion: false,
        addHostClass: false,
        manageContainer: false,
      });
    </script>
  </body>
</html>
